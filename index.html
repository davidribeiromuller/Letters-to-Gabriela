    <script>
      // Filter benign Vite websocket disconnection message in AI Studio sandboxed preview
      (function() {
        var origError = console.error;
        console.error = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('[vite]') !== -1) {
            return;
          }
          return origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('[vite]') !== -1) {
            return;
          }
          return origWarn.apply(console, arguments);
        };
      })();
    </script>
